name: quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify
      - run: npm pack --dry-run
      - run: node src/cli.mjs scan examples/valid --github-annotations
      - name: Composite action smoke test
        uses: ./
        with:
          path: examples/valid
