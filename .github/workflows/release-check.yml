# Runs the exact line a consumer writes, against the published tag.
# Update the tag below as part of each release (see docs/RELEASE.md).
name: release-check
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  action-at-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Released action passes a valid skill
        uses: ClarrieO5/skillpath-guard@v0.3.0
        with:
          path: examples/valid
      - name: Released action fails a broken skill
        id: broken
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@v0.3.0
        with:
          path: examples/broken
      - name: Require the broken-skill run to fail
        run: test "${{ steps.broken.outcome }}" = "failure"
      - name: Released CLI reports the release version
        run: |
          git clone --depth 1 --branch v0.3.0 https://github.com/ClarrieO5/skillpath-guard.git "$RUNNER_TEMP/spg"
          test "$(node "$RUNNER_TEMP/spg/src/cli.mjs" --version)" = "0.3.0"
